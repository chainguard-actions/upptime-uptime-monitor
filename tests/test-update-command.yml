name: Test update command with valid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal upptime config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: test-owner
          repo: test-repo
          assignees: []
          sites:
            - name: Example
              url: https://example.com
          workflowSchedule: {}
          EOF

      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true

      - name: Assert action ran (not a startup/token error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to git/network operations,
          # but NOT fail due to a missing token (which would be a different error).
          # We just verify the action ran (outcome is set, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
