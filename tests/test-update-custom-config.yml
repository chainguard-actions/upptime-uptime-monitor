name: Test update command with custom config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Write custom config and point origin at a local bare repo
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/history" /tmp/upptime-remote.git
          git init --bare /tmp/upptime-remote.git
          git remote set-url origin /tmp/upptime-remote.git 2>/dev/null || \
            git remote add origin /tmp/upptime-remote.git
          git push -u origin HEAD:act-harness
          cat > "$GITHUB_WORKSPACE/.upptimerc.yml" <<'EOF'
          owner: actionchain-harness
          repo: upptime-test
          sites:
            - name: Example Site
              slug: example-site
              url: https://example.com
          assignees: []
          EOF
          cat "$GITHUB_WORKSPACE/.upptimerc.yml"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: update
      - name: Assert action ran (history written, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$GITHUB_WORKSPACE/history/example-site.yml" ]; then
              echo "FAIL: action succeeded but history/example-site.yml was not written"
              exit 1
            fi
            cat "$GITHUB_WORKSPACE/history/example-site.yml"
            if ! grep -q "url: https://example.com" "$GITHUB_WORKSPACE/history/example-site.yml"; then
              echo "FAIL: history file does not reference the monitored URL"
              exit 1
            fi
            echo "PASS: history written"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo issues API is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.upptimerc.yml" "$GITHUB_WORKSPACE/history"
