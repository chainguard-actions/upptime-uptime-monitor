name: Test action fails without token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: testowner
          repo: testrepo
          sites:
            - name: Example
              url: https://example.com
          assignees: []
          workflowSchedule: {}
          EOF
          echo "Created .upptimerc.yml"
      - name: Unset GITHUB_TOKEN to simulate missing token
        run: |
          echo "GITHUB_TOKEN=" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ""
          GH_PAT: ""
          SECRETS_CONTEXT: "{}"
        continue-on-error: true
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no token is provided"
