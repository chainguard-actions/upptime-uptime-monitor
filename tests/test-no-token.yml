name: Test no-token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true
        env:
          # Explicitly unset any token so the action must fail
          GH_PAT: ""
          GITHUB_TOKEN: ""
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
