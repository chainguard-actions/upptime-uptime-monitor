name: Test no-token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without token (expect failure)
        id: action
        uses: .
        with:
          command: update
        env:
          # Ensure no token is available
          GH_PAT: ""
          GITHUB_TOKEN: ""
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
