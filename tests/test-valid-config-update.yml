name: Test valid config update command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .upptimerc.yml config that differs from the default upptime config
      - name: Create minimal Upptime config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: test-owner
          repo: test-repo
          assignees: []
          sites:
            - name: Example
              url: https://example.com
          workflowSchedule:
            updates: "0 * * * *"
          EOF

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action started (reached network/git phase)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at network/git operations,
          # but NOT fail immediately due to missing config or token.
          # Both "success" and "failure" are acceptable here — what matters is
          # that the action ran (not skipped) and the config was read correctly.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with valid config (outcome=$OUTCOME)"
