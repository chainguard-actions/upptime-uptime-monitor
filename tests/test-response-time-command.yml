name: Test response-time command with minimal config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: example-owner
          repo: example-repo
          assignees: []
          sites:
            - name: Example
              url: https://example.com
          workflowSchedule: {}
          EOF
      - id: action
        uses: .
        with:
          command: response-time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert response-time command ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the sentinel repo doesn't exist on GitHub,
          # but it should not produce an unexpected outcome
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: response-time command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: response-time command failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
