name: Test response-time command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .upptimerc.yml with a custom config (different from default)
      - name: Create .upptimerc.yml
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: upptime
          repo: upptime
          assignees: []
          sites:
            - name: Google
              url: https://www.google.com
          skipDeleteIssues: true
          skipDescriptionUpdate: true
          skipTopicsUpdate: true
          skipHomepageUpdate: true
          EOF

      - id: action
        uses: .
        with:
          command: response-time
        env:
          GH_PAT: ${{ github.token }}
        continue-on-error: true

      - name: Assert response-time command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The response-time command may fail at git push (no write access),
          # but it must not be skipped — it should have started.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: response-time command ran (outcome=$OUTCOME)"
