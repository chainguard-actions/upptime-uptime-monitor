name: Test summary command fails without token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with summary command and no token
        id: action
        uses: .
        with:
          command: summary
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          GH_PAT: ""

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for summary command when no token was provided"
