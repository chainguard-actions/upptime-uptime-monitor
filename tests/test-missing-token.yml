name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal upptime config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: test-owner
          repo: test-repo
          assignees: []
          sites:
            - name: Test Site
              url: https://example.com
          workflowSchedule: {}
          EOF

      - id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ""
          GH_PAT: ""
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
