name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .upptimerc.yml config
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/upptimerc.yml" "$GITHUB_WORKSPACE/.upptimerc.yml"

      - id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ""
          GH_PAT: ""
          SECRETS_CONTEXT: "{}"
        continue-on-error: true

      - name: Assert action fails without token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no token is provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (token may have been injected by runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
