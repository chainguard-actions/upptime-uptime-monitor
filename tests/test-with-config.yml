name: Test with valid config (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .upptimerc.yml config in the workspace
      - name: Create .upptimerc.yml config
        run: |
          cat > "$GITHUB_WORKSPACE/.upptimerc.yml" << 'EOF'
          owner: test-owner
          repo: test-repo
          assignees: []
          sites:
            - name: Google
              url: https://www.google.com
          EOF

      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
