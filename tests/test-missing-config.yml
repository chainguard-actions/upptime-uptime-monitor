name: Test missing config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure .upptimerc.yml does not exist
        run: |
          rm -f .upptimerc.yml
          echo "Confirmed: .upptimerc.yml does not exist"

      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when .upptimerc.yml is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without .upptimerc.yml"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
