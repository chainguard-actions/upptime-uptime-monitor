name: Test missing config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no .upptimerc.yml exists
        run: |
          rm -f .upptimerc.yml
          echo "Confirmed: no .upptimerc.yml present"
          ls -la .upptimerc.yml 2>&1 || echo "File does not exist (expected)"

      - id: action
        name: Run action (expect failure due to missing config)
        uses: .
        with:
          command: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when .upptimerc.yml is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config file is missing"
