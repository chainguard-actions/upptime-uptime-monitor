name: Test missing config error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no .upptimerc.yml exists
        run: |
          rm -f .upptimerc.yml
          echo "Confirmed: no .upptimerc.yml present"
          ls -la .

      - id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true

      - name: Assert action failed due to missing config
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when .upptimerc.yml is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config is missing"
