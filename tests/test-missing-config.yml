name: Test missing config graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: update
        continue-on-error: true
      - name: Assert action fails gracefully without config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without .upptimerc.yml the action should fail (not crash the runner)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no .upptimerc.yml)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (config may have been found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
