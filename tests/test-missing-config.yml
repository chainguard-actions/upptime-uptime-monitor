name: Test missing .upptimerc.yml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no Upptime config exists
        run: |
          rm -f "$GITHUB_WORKSPACE/.upptimerc.yml"
          if [ -f "$GITHUB_WORKSPACE/.upptimerc.yml" ]; then
            echo "FAIL: could not remove config"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: update
      - name: Assert action failed because config is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when .upptimerc.yml is missing"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/history" ]; then
            echo "FAIL: history directory should not have been created"
            exit 1
          fi
          echo "PASS"
