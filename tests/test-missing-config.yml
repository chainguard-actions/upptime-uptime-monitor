name: Test missing config fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no .upptimerc.yml exists in the workspace
      - name: Remove config if present
        run: rm -f .upptimerc.yml

      - id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when .upptimerc.yml is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config is missing"
