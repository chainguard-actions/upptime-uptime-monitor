name: Test missing config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether a config file exists
        id: pre
        run: |
          if [ -f "$GITHUB_WORKSPACE/.upptimerc.yml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: site
      - name: Assert action failed without .upptimerc.yml
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXISTS: ${{ steps.pre.outputs.exists }}
        run: |
          echo "outcome: $OUTCOME (config existed: $EXISTS)"
          if [ "$EXISTS" = "true" ]; then
            echo "SKIP: repository already has .upptimerc.yml; missing-config scenario not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when .upptimerc.yml is missing"
            exit 1
          fi
          echo "PASS"
