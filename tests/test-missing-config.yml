name: Test missing .upptimerc.yml config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no Upptime config is present
        run: |
          if [ -f "$GITHUB_WORKSPACE/.upptimerc.yml" ]; then
            echo "FAIL: precondition - .upptimerc.yml unexpectedly exists in workspace root"
            exit 1
          fi
          echo "No .upptimerc.yml present (as intended)"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: update
      - name: Assert action failed without config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when .upptimerc.yml is missing"
            exit 1
          fi
          echo "PASS: action failed as expected without configuration"
