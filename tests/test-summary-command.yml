name: Test summary command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: test-owner
          repo: test-repo
          sites:
            - name: Example
              url: https://example.com
          assignees: []
          workflowSchedule: {}
          EOF

      - id: action
        uses: .
        with:
          command: summary
        continue-on-error: true

      - name: Assert summary command ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: summary command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: summary command failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
