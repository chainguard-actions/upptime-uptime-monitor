name: Test summary command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create minimal .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          sites:
            - name: Example
              url: https://example.com
          assignees: []
          workflowSchedule:
            summary: "0 * * * *"
          EOF
          echo "Created .upptimerc.yml"

      - name: Create minimal README.md with status page markers
        run: |
          cat > README.md << 'EOF'
          # Status Page

          <!--start: status pages-->
          <!--end: status pages-->

          ## About
          This is a test status page.
          EOF
          echo "Created README.md"

      - id: action
        uses: .
        with:
          command: summary
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert summary command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The summary command may fail due to git push permissions or
          # missing history files, but it should NOT be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: summary command ran with outcome=$OUTCOME"
