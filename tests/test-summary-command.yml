name: Test summary command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal .upptimerc.yml
      - name: Create .upptimerc.yml
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: upptime
          repo: upptime
          assignees: []
          sites:
            - name: Google
              url: https://www.google.com
          skipDeleteIssues: true
          skipDescriptionUpdate: true
          skipTopicsUpdate: true
          skipHomepageUpdate: true
          EOF

      # Create a minimal README.md with the required HTML comments
      - name: Create README.md
        run: |
          cat > README.md << 'EOF'
          # Uptime Monitor Test

          <!--start: status pages-->
          <!--end: status pages-->

          ## About
          This is a test README.
          EOF

      - id: action
        uses: .
        with:
          command: summary
        env:
          GH_PAT: ${{ github.token }}
        continue-on-error: true

      - name: Assert summary command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The summary command may fail at git push (no write access),
          # but it must not be skipped — it should have started.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: summary command ran (outcome=$OUTCOME)"
