name: Test summary command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create minimal .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          sites:
            - name: Example
              url: https://example.com
          assignees: []
          workflowSchedule: {}
          EOF
          echo "Created .upptimerc.yml"

      - name: Create minimal README.md with status page markers
        run: |
          cat > README.md << 'EOF'
          # Status Page

          <!--start: status pages-->
          <!--end: status pages-->

          ## History
          EOF
          echo "Created README.md"

      - name: Create history directory
        run: mkdir -p history

      - id: action
        uses: .
        with:
          command: summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert summary command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The summary command should run and either succeed or fail gracefully
          # (e.g., fail on git push due to permissions, but not crash)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: summary command ran and completed (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
