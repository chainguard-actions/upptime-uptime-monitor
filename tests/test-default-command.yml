name: Test default command (update)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No 'command' input — should use the default value of 'update'
        continue-on-error: true
        env:
          # No token provided — action should fail with "GitHub token not found"
          GH_PAT: ""
          GITHUB_TOKEN: ""
      - name: Assert action failed (no token provided, default command used)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with default command and no token"
