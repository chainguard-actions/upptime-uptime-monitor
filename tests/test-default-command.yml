name: Test default command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default command (no explicit command input)
        id: action
        uses: .
        env:
          GH_PAT: ""
          GITHUB_TOKEN: ""
        continue-on-error: true

      - name: Assert action failed due to missing token (not due to bad command)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of missing token, not because of an
          # invalid command. This confirms the default command 'update' is accepted.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at token check with default command"
