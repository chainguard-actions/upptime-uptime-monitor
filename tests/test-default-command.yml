name: Test default update command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal .upptimerc.yml config
        run: |
          cat > .upptimerc.yml << 'EOF'
          owner: test-owner
          repo: test-repo
          sites:
            - name: Example
              url: https://example.com
          EOF
      - id: action
        uses: .
        with:
          command: update
        env:
          GH_PAT: fake-token-for-testing
        continue-on-error: true
      - name: Assert action ran the update command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token the action will fail when trying to call GitHub API
          # but it should not crash before reaching the command dispatch logic
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran update command and failed as expected with fake token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran update command successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
