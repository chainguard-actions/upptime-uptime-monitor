name: Test default update command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default update command (expect failure without config)
        id: action
        uses: .
        with:
          command: update
        env:
          GITHUB_TOKEN: ""
          GH_PAT: ""
        continue-on-error: true
      - name: Assert action failed (no token/config available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without a valid token and config, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without required configuration"
